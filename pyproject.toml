[project]
name = "skyblock-flip"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "pydantic-settings>=2.6,<3.0",
  "pydantic>=2.6,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
